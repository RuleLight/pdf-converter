name: Build desktop apps

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            python_arch: x64
            artifact: PDF-to-Word-Windows-x64
          - label: macOS Apple Silicon
            os: macos-15
            python_arch: arm64
            artifact: PDF-to-Word-macOS-Apple-Silicon
          - label: macOS Intel
            os: macos-15-intel
            python_arch: x64
            artifact: PDF-to-Word-macOS-Intel

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build native application
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name "PDF-to-Word"
          --collect-all pdf2docx
          --collect-all pytesseract
          app.py

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/PDF-to-Word" -DestinationPath "release/${{ matrix.artifact }}.zip"

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/PDF-to-Word.app" \
            "release/${{ matrix.artifact }}.zip"

      - name: Upload native application
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download native applications
        uses: actions/download-artifact@v7
        with:
          path: downloaded-artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f -name '*.zip' -exec cp {} release-assets/ \;
          test "$(find release-assets -type f -name '*.zip' | wc -l)" -eq 3

      - name: Create or update v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 release-assets/*.zip --clobber
            gh release edit v1.0.0 --notes-file RELEASE_NOTES.md --title "PDF to Word v1.0.0"
          else
            gh release create v1.0.0 release-assets/*.zip \
              --target "$GITHUB_SHA" \
              --title "PDF to Word v1.0.0" \
              --notes-file RELEASE_NOTES.md
          fi
